<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Vendor Dashboard</ion-title>
  </ion-toolbar>

  <!-- STATUS FILTER -->
  <ion-toolbar>
    <ion-segment [(ngModel)]="selectedStatus">

      <ion-segment-button value="all">
        <ion-label>All</ion-label>
      </ion-segment-button>

      <ion-segment-button value="pending">
        <ion-label>Pending</ion-label>
      </ion-segment-button>

      <ion-segment-button value="confirmed">
        <ion-label>Confirmed</ion-label>
      </ion-segment-button>

      <ion-segment-button value="cancelled">
        <ion-label>Cancelled</ion-label>
      </ion-segment-button>

    </ion-segment>
  </ion-toolbar>
</ion-header>


<ion-content>

  <!-- Pull to refresh -->

  <ion-refresher slot="fixed" (ionRefresh)="refreshBookings($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>


  <!-- Loading Skeleton -->

  <div *ngIf="isLoading">

    <ion-card *ngFor="let i of [1,2,3]" class="booking-card">
      <ion-card-content>
        <ion-skeleton-text animated style="width:70%"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:40%"></ion-skeleton-text>
      </ion-card-content>
    </ion-card>

  </div>


  <!-- Booking Cards -->

  <div *ngIf="!isLoading">

    <ion-card *ngFor="let booking of filteredBookings" class="booking-card" [ngClass]="booking.status">

      <!-- STATUS RIBBON -->
      <div class="status-ribbon" [ngClass]="booking.status">
        {{ booking.status }}
      </div>

      <ion-card-content>

        <div class="top-section">

          <div class="avatar">
            {{ booking.customerName.charAt(0) }}
          </div>

          <div class="customer-info">
            <h2>{{ booking.customerName }}</h2>
            <p>{{ booking.customerPhone }}</p>
          </div>

        </div>

        <div class="details">

          <div class="row">
            <ion-icon name="construct-outline"></ion-icon>
            {{ booking.serviceType }}
          </div>

          <div class="row">
            <ion-icon name="time-outline"></ion-icon>
            {{ booking.slotTime | date:'medium' }}
          </div>

          <div class="row">
            <ion-icon name="location-outline"></ion-icon>
            {{ booking.location }}
          </div>

        </div>

        <div class="actions" *ngIf="booking.status === 'pending'">

          <ion-button expand="block" class="confirm-btn" (click)="confirmBooking(booking._id!)">

            ✔ Confirm

          </ion-button>

          <ion-button expand="block" class="cancel-btn" (click)="cancelBooking(booking._id!)">

            ❌ Cancel

          </ion-button>

        </div>

        <ion-button expand="block" fill="outline" color="primary" (click)="callCustomer(booking.customerPhone)">
          📞 Call Customer
        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
