<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Service Booking</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ member.name }}</ion-card-title>
      <ion-card-subtitle>{{ member.service }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-button expand="block" (click)="bookSlot()">
        Book Slot
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
