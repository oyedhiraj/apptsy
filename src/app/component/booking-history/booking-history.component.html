<ion-header>
  <ion-toolbar color="primary">
    <ion-title>My Bookings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="history-bg ion-padding">

  <!-- Empty State -->
  <div *ngIf="bookings.length === 0" class="empty-state">
    <ion-icon name="calendar-outline"></ion-icon>
    <p>No bookings yet</p>
  </div>

  <!-- Booking Card -->
  <div
    *ngFor="let booking of bookings"
    class="booking-card"
    [ngClass]="booking.status"
  >

    <!-- Top Section -->
    <div class="top">

      <div class="avatar">
        {{ booking.vendorId?.name?.charAt(0) || 'V' }}
      </div>

      <div class="info">
        <h3>{{ booking.vendorId?.name }}</h3>
        <p>{{ booking.serviceType | titlecase }}</p>
      </div>

      <span class="status">
        {{ booking.status }}
      </span>

    </div>

    <div class="divider"></div>

    <!-- Booking Details -->
    <div class="details">

      <div class="row">
        <ion-icon name="call-outline"></ion-icon>
        <span>{{ booking.vendorId?.number }}</span>
      </div>

      <div class="row">
        <ion-icon name="location-outline"></ion-icon>
        <span>{{ booking.location }}</span>
      </div>

      <div class="row">
        <ion-icon name="time-outline"></ion-icon>
        <span>{{ booking.createdAt | date:'medium' }}</span>
      </div>

    </div>

  </div>

</ion-content>
